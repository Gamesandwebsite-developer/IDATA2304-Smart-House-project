[project]
name = "idata2304-smart-house-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jiaqi", email = "j.zhaojiaqi@student.utwente.nl" }
]
# Select an interpreter compatible with the project.
requires-python = ">=3.14"
dependencies = []

# Register the server command for uv run and installed environments.
[project.scripts]
idata2304-smart-house-project = "idata2304_smart_house_project:main"

# Use uv's build backend to package the src-layout project.
[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

# Test tools are installed in the development environment.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
]
